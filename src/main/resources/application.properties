# Server configuration
server.port=${PORT:3087}

# Receipt storage path
receipt.storage.path=src/main/resources/receipts/

# Render PostgreSQL Database Configuration (ONLINE DATABASE)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repairsystem}
spring.datasource.username=${DB_USERNAME:repairsystem_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.connectionTimeout=30000